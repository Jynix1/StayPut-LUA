name: Auto Release StayPutLUA

on:
  push:
    branches:
      - main

# REQUIRED: Grants the workflow permission to push tags and create releases
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          # Removed 'custom_tag' so it automatically increments (0.0.1 -> 0.0.2 etc.)

      - name: Create .love Package
        run: |
          Get-ChildItem -Path . -Exclude @(".git", ".github", "game.love", "game.zip") | Compress-Archive -DestinationPath game.zip
          Rename-Item -Path game.zip -NewName game.love

      - name: Download Official LÖVE Engine
        shell: powershell
        run: |
          # Fixed URL: Now points directly to the official 11.5 Windows 64-bit zip
          Invoke-WebRequest -Uri "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip" -OutFile love-win64.zip
          Expand-Archive -Path love-win64.zip -DestinationPath love_engine

      - name: Compile Windows Executable Binary
        shell: powershell
        run: |
          mkdir dist
          # Fuses love.exe and game.love together
          cmd /c "copy /b love_engine\love-11.5-win64\love.exe + game.love dist\StayPutLUA.exe"
          
          # Copies necessary LÖVE dependencies and license
          copy love_engine\love-11.5-win64\*.dll dist\
          copy love_engine\love-11.5-win64\license.txt dist\
          
          # Copies the custom Discord RPC DLL into the same folder as the .exe
          copy discord-rpc.dll dist\
          
          # Zips the final executable folder for the release using the new tag
          Compress-Archive -Path dist\* -DestinationPath StayPutLUA-${{ steps.tag_version.outputs.new_tag }}-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          files: |
            StayPutLUA-*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}