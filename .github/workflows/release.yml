name: auto release LOVE

on:
  push:
    branches:
      - main

jobs:
  bump-version-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_tag: '0.0.1'

      - name: Create .love Package
        shell: powershell
        run: |
          Compress-Archive -Path * -DestinationPath game.love -Exclude @(".git", ".github", "game.love")

      - name: Download Official LÖVE Engine
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com" -OutFile love-win64.zip
          Expand-Archive -Path love-win64.zip -DestinationPath love_engine

      - name: Compile Windows Executable Binary
        shell: powershell
        run: |
          mkdir dist
          cmd /c "copy /b love_engine\love-11.5-win64\love.exe + game.love dist\StayPutLUA.exe"
          copy love_engine\love-11.5-win64\*.dll dist\
          copy love_engine\love-11.5-win64\license.txt dist\
          Compress-Archive -Path dist\* -DestinationPath StayPutLUA-${{ steps.tag_version.outputs.new_tag }}-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          files: |
            StayPutLUA-*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}